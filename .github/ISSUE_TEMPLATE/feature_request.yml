name: Feature request
description: An idea that would make the pane more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see or do
      description: The situation you are in and what is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How it could look or work in the pane, if you have one in mind.
