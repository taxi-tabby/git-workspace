name: PR description

# pull_request_target runs this workflow and the checker as they are on main, never the
# pull request's copy, so a pull request cannot loosen the check that judges it. Nothing
# from the pull request is checked out or run; its description is read as data from an
# environment variable, never pasted into a script.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the description against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-pr-body.mjs
